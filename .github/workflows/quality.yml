name: Portfolio quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  browser-checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browsers: chromium,firefox,webkit
          - os: windows-latest
            browsers: chromium,firefox
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium firefox webkit
      - if: runner.os == 'Windows'
        run: npx playwright install chromium firefox
      - run: npm run build
      - run: npm run qa
        env:
          TEST_BROWSERS: ${{ matrix.browsers }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: qa/latest
